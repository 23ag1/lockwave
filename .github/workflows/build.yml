name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: ./build.sh "${GITHUB_REF_NAME#v}"
      - name: Package
        run: ditto -c -k --keepParent build/LockWave.app LockWave.zip
      - uses: actions/upload-artifact@v4
        with:
          name: LockWave
          path: LockWave.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" LockWave.zip --title "LockWave $GITHUB_REF_NAME" --notes-file RELEASE.md
